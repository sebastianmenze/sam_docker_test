services:
  sam-audio:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam-audio:latest
    container_name: sam-audio-test
    # GPU access — requires nvidia-container-toolkit on the host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Change to a specific GPU index (e.g. "1") to pin to the RTX A6000
              device_ids: ["all"]
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Set your Hugging Face token in .env or export it before running
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Mount your audio files into the container
      - ./audio_files:/workspace/audio_files
      # Output will be written here
      - ./output:/workspace/output
      # Scripts are hot-reloaded — edit without rebuilding
      - ./scripts:/workspace/scripts
      # Local model checkpoints — no download needed
      - ./models:/workspace/models
      # Persist HuggingFace downloads across container restarts
      - hf_cache:/root/.cache/huggingface
      # Persist ImageBind weights across container restarts
      - imagebind_cache:/workspace/.checkpoints
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  hf_cache:
  imagebind_cache:
